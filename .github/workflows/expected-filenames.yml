name: Expected filenames

on:
  # Upstream automation, kept for reference but never triggered here: it
  # targets DeepSeek's enterprise and self-hosted runner pools and their
  # secrets, neither of which exists in this fork. Runs would queue forever
  # rather than fail. Manual dispatch stays available for anyone who wires
  # up equivalent infrastructure.
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  expected-filenames:
    name: no golden filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tracked filenames
        run: scripts/check-expected-filenames.sh
