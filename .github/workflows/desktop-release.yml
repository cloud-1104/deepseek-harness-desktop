name: Desktop release

# Installer builds for the Electron shell. Native addons in the staged backend
# are rebuilt against the Electron ABI on the platform they ship to, so every
# target needs its own runner and no artifact is cross-built. See
# apps/desktop/README.md.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the installers to the GitHub release for this ref.
        type: boolean
        required: false
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'
  # A stray Developer ID in a runner keychain must never silently sign a build
  # the release notes describe as unsigned.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-2025
          - label: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace artifacts
        run: pnpm run build

      - name: Stage the backend and rebuild native addons
        run: pnpm --filter @deepseek-ai/dsh-desktop run prepare-backend --skip-build

      # `run dist`, not `exec electron-builder`: the script compiles the shell
      # first, and lib/ is generated, so a clean checkout has no entry file.
      #
      # Never publishes from here. Two matrix jobs each asking electron-builder
      # to publish race on "does a release for this tag exist", and both lose:
      # GitHub accepts several drafts for one tag, so the run ends with two
      # half-filled releases. The publish job below makes exactly one.
      - name: Build installers
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          # The update metadata ships with the installers: electron-updater
          # reads latest.yml and the block maps, not the installer alone.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: draft release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A draft, so the assets can be checked before anyone can download them.
      - name: Draft one release for every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}" artifacts/*
          --draft
          --title "${{ github.ref_name }}"
          --notes-file apps/desktop/build/release-notes.md
