name: Issue policy

on:
  # Upstream automation, kept for reference but never triggered here: it
  # targets DeepSeek's enterprise and self-hosted runner pools and their
  # secrets, neither of which exists in this fork. Runs would queue forever
  # rather than fail. Manual dispatch stays available for anyone who wires
  # up equivalent infrastructure.
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
